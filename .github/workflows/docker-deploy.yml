name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: robertadamyan/fastapi-task-manager
      DEPLOYMENT_FILE: kubernetes/deployment.yaml

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Get Git commit SHA
      id: vars
      run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Docker image
      run: |
        docker build -t $IMAGE_NAME:${{ env.COMMIT_SHA }} .


    - name: Push Docker image
      run: |
        docker push $IMAGE_NAME:${{ env.COMMIT_SHA }}


    - name: Update deployment.yaml
      run: |
        echo "Updating deployment.yaml with image tag ${{ env.COMMIT_SHA }}"
        sed -i "s|image: $IMAGE_NAME:.*|image: $IMAGE_NAME:${{ env.COMMIT_SHA }}|" $DEPLOYMENT_FILE


    - name: Commit deployment.yaml
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add $DEPLOYMENT_FILE
        git commit -m "Update deployment.yaml with image tag ${{ env.COMMIT_SHA }}" || echo "No changes to commit"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
